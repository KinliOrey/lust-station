- type: entity
  parent: BaseGameRule
  id: ERTShuttleEpsilonArrows
  components:
  - type: StationEvent
    startAnnouncement: null
    startAudio: /Audio/Announcements/bloblarm.ogg
    duration: -0
    endAudio: /Audio/Announcements/bloblarm.ogg
  - type: LoadMapRule
    preloadedGrid: MTShuttle
  - type: RuleGrids

- type: entity
  id: vendingmachineMalfunction
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vending-malfunction-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 15
    minimumPlayers: 10
    weight: 5
    duration: 1
  - type: VendingMachineMalfRule
    minMachines: 20
    maxMachines: 20
    minItems: 1
    maxItems: 7
    maxOccurrences: 1
    occursDuringRoundEnd: false

- type: entity
  id: CrewMonitoringMalf
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    earliestStart: 15
    minimumPlayers: 1
    weight: 4
    duration: 60
    maxDuration: 180
    reoccurrenceDelay: 1
    maxOccurrences: 1
    occursDuringRoundEnd: false
  - type: CrewMonitoringMalfRule
    minPlayerFraction: 1
    maxPlayerFraction: 1
    criticalChance: 25
    deadChance: 10
    poorChance: 50
  - type: GameRule
    delay:
      min: 0
      max: 0